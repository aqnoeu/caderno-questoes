name: Ajuste pontual de formatação do gabarito
on:
  push:
    branches:
      - fix/v63-gabarito-tipo-pdf
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/answer-key-pdf.js
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/answer-key-pdf.js
            git commit -m "style: formatar leitor de gabaritos com Prettier"
            git push origin HEAD:fix/v63-gabarito-tipo-pdf
          fi
