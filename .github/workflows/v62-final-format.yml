name: v62 ajustar formatação
on:
  push:
    branches:
      - feature/v62-cadernos-ia
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write supabase/functions/prepare-exam-import/index.ts src/notebooks.jsx src/ai-settings.jsx
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/prepare-exam-import/index.ts src/notebooks.jsx src/ai-settings.jsx
            git commit -m "style(v62): aplicar Prettier novamente aos módulos"
            git push origin HEAD:feature/v62-cadernos-ia
          fi
