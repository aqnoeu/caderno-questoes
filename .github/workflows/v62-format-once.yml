name: Formatação pontual v62 (temporário)

on:
  push:
    branches:
      - feature/v62-cadernos-ia

permissions:
  contents: write

jobs:
  format-v62:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Formatar somente os arquivos novos
        run: npx prettier --write src/notebooks.jsx src/ai-settings.jsx supabase/functions/prepare-exam-import/index.ts
      - name: Salvar formatação
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/notebooks.jsx src/ai-settings.jsx supabase/functions/prepare-exam-import/index.ts
            git commit -m "style(v62): aplicar Prettier aos arquivos novos"
            git push origin HEAD:feature/v62-cadernos-ia
          fi
